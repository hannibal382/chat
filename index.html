<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chat Hannibal382</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/tmi.js@1.8.5/dist/tmi.min.js"></script>
</head>
<body>

<div id="chat"></div>
<script>
  const chat = document.getElementById("chat");

  const client = new tmi.Client({
    connection: {
      secure: true,
      reconnect: true
    },
    channels: ['hannibal382']
  });

  client.connect();

  client.on('message', (channel, tags, message) => {
    const msg = document.createElement('div');
    msg.classList.add('message');

    if (tags.badges) {
      if (tags.badges.broadcaster) msg.classList.add('broadcaster');
      if (tags.badges.moderator) msg.classList.add('mod');
      if (tags.badges.subscriber) msg.classList.add('subscriber');
    }

    msg.innerHTML = `
      <span class="username">${tags['display-name']} :</span>
      <span class="text">${message}</span>
    `;

    chat.appendChild(msg);

    setTimeout(() => {
      msg.remove();
    }, 15000);
  });
</script>


</body>
</html>
